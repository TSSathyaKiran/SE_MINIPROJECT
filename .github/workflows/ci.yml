name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run unit and API tests
        env:
          FLASK_CONFIG: testing
          SECRET_KEY: ci-secret
        run: |
          # exit code 5 = no tests collected yet; treat that as a pass
          pytest -q tests --ignore=tests/ui --ignore=tests/performance --ignore=tests/security || [ $? -eq 5 ]

  ui:
    # Selenium tests in headless Chrome (installed on GitHub's Ubuntu runners)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt selenium==4.27.1
      - name: Run browser tests (login flow, keyboard-only flows)
        run: pytest -v tests/ui
