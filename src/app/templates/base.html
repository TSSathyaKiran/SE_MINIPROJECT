<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student Record System{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <a class="visually-hidden-focusable" href="#main">Skip to content</a>
  <nav class="navbar navbar-expand-md navbar-dark bg-primary" aria-label="Main">
    <div class="container">
      <a class="navbar-brand" href="/ui/home">SRS-App</a>
      {% if user %}
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
              aria-controls="nav" aria-expanded="false" aria-label="Toggle menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          {% for label, path, built in menu if built %}
          <li class="nav-item"><a class="nav-link" href="{{ path }}">{{ label }}</a></li>
          {% endfor %}
        </ul>
        <span class="navbar-text me-3">{{ user.name }} ({{ user.role }})</span>
        <form data-api="/auth/logout" data-redirect="/ui/login">
          <button class="btn btn-outline-light btn-sm">Log out</button>
        </form>
      </div>
      {% endif %}
    </div>
  </nav>
  <main id="main" class="container py-4">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
