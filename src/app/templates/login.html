{% extends "base.html" %}
{% block title %}Log in · SRS-App{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-8 col-md-5">
    <h1 class="h3 mb-4">Log in</h1>
    <form data-api="/auth/login" data-redirect="/ui/home">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" name="username" class="form-control" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password" type="password" class="form-control"
               autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100">Log in</button>
      <div class="form-msg mt-3" role="alert"></div>
    </form>
  </div>
</div>
{% endblock %}
